# Style settings for the diagram scripts of the thesis.
line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "W", "I"]
# Star imports of the shared plotting helpers (fig_common, tud_style) are intended;
# short loop names (l) and one-line statements are used in the plotting code.
ignore = ["F403", "F405", "E741", "E701", "E702", "E731", "E402", "E501"]
